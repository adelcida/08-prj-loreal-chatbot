<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Assistant</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        
        <h1 class="site-title"><img src="img/loreal-logo.png"> Product Advisor</h1>
      </header>
      <!------- Chat Area ------->

      <div class="current-query-container" aria-live="polite">
        <div class="current-query-label">Current question</div>
        <div id="currentQuery" class="current-query-text">No question yet</div>
      </div>

      <main>
        <section class="chatbox">
          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2026 L'Oréal . All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="https://www.lorealparisusa.com/privacy-policy">Privacy Policy</a>
          <a href="https://www.lorealparisusa.com/contact-us">Terms of Use</a>
          <a href="https://www.lorealparisusa.com/contact-us">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
